services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: codereview
      POSTGRES_USER: codereview
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereview"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: valkey/valkey:9-alpine
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # No `ports:` here on purpose — the bundled `nginx` container (below) is the
  # only published entry point for HTTP traffic, so every request actually
  # gets TLS. Running your own external reverse proxy instead? See "Bring
  # your own reverse proxy" in the README — merge docker-compose.byo-proxy.yml
  # to republish this port.
  app:
    image: ghcr.io/codeveira/codeveira:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      DATABASE_URL: postgresql://codereview:${DB_PASSWORD:?DB_PASSWORD must be set}@db/codereview
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      APP_HOST: ${APP_HOST}
      FORCE_SSL: ${FORCE_SSL:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      GITLAB_URL: ${GITLAB_URL}
      GITLAB_APP_ID: ${GITLAB_APP_ID}
      GITLAB_APP_SECRET: ${GITLAB_APP_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_SECRET: ${GITHUB_APP_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITEA_URL: ${GITEA_URL}
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET}
      BITBUCKET_WEBHOOK_SECRET: ${BITBUCKET_WEBHOOK_SECRET}
      BITBUCKET_SERVER_WEBHOOK_SECRET: ${BITBUCKET_SERVER_WEBHOOK_SECRET}
      AZURE_WEBHOOK_SECRET: ${AZURE_WEBHOOK_SECRET}
      GERRIT_WEBHOOK_SECRET: ${GERRIT_WEBHOOK_SECRET}
      LSP_PROXY_SHARED_SECRET: ${LSP_PROXY_SHARED_SECRET:-}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
      RAILS_INBOUND_EMAIL_PASSWORD: ${RAILS_INBOUND_EMAIL_PASSWORD:-}
      LDAP_HOST: ${LDAP_HOST}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_SSL: ${LDAP_SSL:-false}
      LDAP_BASE: ${LDAP_BASE}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_PASSWORD: ${LDAP_PASSWORD}
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SYMBOL_INDEXER_URL: http://indexer:8090
      SYMBOL_INDEXER_TOKEN: ${SYMBOL_INDEXER_TOKEN:-}
      LINT_RUNNER_URL: http://lint-runner:8091
      LINT_RUNNER_TOKEN: ${LINT_RUNNER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage
      - ./backup:/backups
      - nginx_certs:/etc/letsencrypt
      - nginx_conf:/etc/nginx/conf.d
      - acme_webroot:/var/www/acme-challenge
    # start_period is generous because entrypoint.sh runs db:migrate before
    # Puma starts listening — this is also what rollout.sh polls to gate a
    # zero-downtime swap on the new container actually being ready.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  indexer:
    image: ghcr.io/codeveira/codeveira-indexer:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      INDEXER_PORT: 8090
      MAX_FILE_SIZE_BYTES: "2000000"
      INDEXER_TOKEN: ${SYMBOL_INDEXER_TOKEN:-}
    mem_limit: ${INDEXER_MEM_LIMIT:-768m}
    cpus: ${INDEXER_CPUS:-1.0}
    restart: unless-stopped

  lint-runner:
    image: ghcr.io/codeveira/codeveira-lint-runner:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      LINT_RUNNER_PORT: 8091
      MAX_FILE_SIZE_BYTES: "2000000"
      LINT_RUNNER_TOKEN: ${LINT_RUNNER_TOKEN:-}
    mem_limit: ${LINT_RUNNER_MEM_LIMIT:-768m}
    cpus: ${LINT_RUNNER_CPUS:-1.0}
    restart: unless-stopped

  # Enterprise-only, opt-in per repository (Repository#semantic_analysis_enabled).
  # Unlike indexer/lint-runner, this runs `go mod download` against a real,
  # untrusted target repo's go.mod — so it gets no direct network route at
  # all (only membership in semantic_analysis_net, which is `internal: true`)
  # and can only reach the world through semantic-analysis-proxy's allow list.
  semantic-analysis:
    image: ghcr.io/codeveira/codeveira-semantic-analysis:${IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - semantic_analysis_go_mod:/home/analyzer/go/pkg/mod
    environment:
      SEMANTIC_ANALYSIS_TOKEN: ${SEMANTIC_ANALYSIS_TOKEN:-}
      HTTP_PROXY: http://semantic-analysis-proxy:8888
      HTTPS_PROXY: http://semantic-analysis-proxy:8888
      NO_PROXY: localhost,127.0.0.1
    networks:
      - semantic_analysis_net
    depends_on:
      - semantic-analysis-proxy
    mem_limit: ${SEMANTIC_ANALYSIS_MEM_LIMIT:-1536m}
    cpus: ${SEMANTIC_ANALYSIS_CPUS:-1.5}
    restart: unless-stopped

  # Egress allow list for `semantic-analysis`'s sandboxed `go mod download`
  # step: proxy.golang.org / sum.golang.org / storage.googleapis.com only.
  # Dual-homed on purpose — the default network for its own real uplink to
  # the module proxy, plus semantic_analysis_net so semantic-analysis (which
  # has no other route out) can reach it.
  semantic-analysis-proxy:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-proxy:${IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - default
      - semantic_analysis_net
    restart: unless-stopped

  # TypeScript sibling of `semantic-analysis` — same shape and same trust
  # boundary, but drives `typescript-language-server` over an untrusted
  # repo's own `npm ci --ignore-scripts` instead of `go mod download`.
  semantic-analysis-ts:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-ts:${IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - semantic_analysis_ts_npm:/home/analyzer/.npm
    environment:
      SEMANTIC_ANALYSIS_TS_TOKEN: ${SEMANTIC_ANALYSIS_TS_TOKEN:-}
      HTTP_PROXY: http://semantic-analysis-ts-proxy:8888
      HTTPS_PROXY: http://semantic-analysis-ts-proxy:8888
      NO_PROXY: localhost,127.0.0.1
    networks:
      - semantic_analysis_ts_net
    depends_on:
      - semantic-analysis-ts-proxy
    mem_limit: ${SEMANTIC_ANALYSIS_TS_MEM_LIMIT:-1536m}
    cpus: ${SEMANTIC_ANALYSIS_TS_CPUS:-1.5}
    restart: unless-stopped

  # Egress allow list for `semantic-analysis-ts`'s sandboxed `npm ci` step:
  # registry.npmjs.org only. A separate proxy from semantic-analysis-proxy
  # on purpose — each sandboxed language only ever needs its own package
  # registry, and sharing one proxy would let either sandbox's egress reach
  # the other language's registry too.
  semantic-analysis-ts-proxy:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-ts-proxy:${IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - default
      - semantic_analysis_ts_net
    restart: unless-stopped

  # Python sibling of `semantic-analysis`/`semantic-analysis-ts` — same
  # shape and same trust boundary, but drives `pyright-langserver` over an
  # untrusted repo's own `pip install --only-binary=:all:` instead of
  # `go mod download`/`npm ci --ignore-scripts`. pip has no --ignore-scripts
  # equivalent for source distributions (installing an sdist always runs its
  # setup.py/build backend); restricting to prebuilt wheels only removes
  # that arbitrary-code-execution surface at install time.
  semantic-analysis-py:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-py:${IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - semantic_analysis_py_pip:/home/analyzer/.cache/pip
    environment:
      SEMANTIC_ANALYSIS_PY_TOKEN: ${SEMANTIC_ANALYSIS_PY_TOKEN:-}
      HTTP_PROXY: http://semantic-analysis-py-proxy:8888
      HTTPS_PROXY: http://semantic-analysis-py-proxy:8888
      NO_PROXY: localhost,127.0.0.1
    networks:
      - semantic_analysis_py_net
    depends_on:
      - semantic-analysis-py-proxy
    mem_limit: ${SEMANTIC_ANALYSIS_PY_MEM_LIMIT:-1536m}
    cpus: ${SEMANTIC_ANALYSIS_PY_CPUS:-1.5}
    restart: unless-stopped

  # Egress allow list for `semantic-analysis-py`'s sandboxed `pip install`
  # step: pypi.org (index API) and files.pythonhosted.org (actual wheel
  # downloads) only. A separate proxy from the Go/TypeScript ones on
  # purpose, same reasoning as above.
  semantic-analysis-py-proxy:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-py-proxy:${IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - default
      - semantic_analysis_py_net
    restart: unless-stopped

  # Java sibling of the above three — drives Eclipse JDT Language Server
  # (jdtls) over an untrusted repo's own `mvn dependency:resolve` instead of
  # `go mod download`/`npm ci --ignore-scripts`/`pip install`. Maven-only
  # scope: gated on a `pom.xml` at the workspace root, Gradle
  # (`build.gradle`/`build.gradle.kts`, which are executable Groovy/Kotlin
  # scripts evaluated just by importing the project) is out of scope for the
  # same reason arbitrary `go generate`/npm lifecycle scripts/sdist builds
  # are out of scope for the other three.
  semantic-analysis-java:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-java:${IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - semantic_analysis_java_m2:/home/analyzer/.m2/repository
    environment:
      SEMANTIC_ANALYSIS_JAVA_TOKEN: ${SEMANTIC_ANALYSIS_JAVA_TOKEN:-}
      HTTP_PROXY: http://semantic-analysis-java-proxy:8888
      HTTPS_PROXY: http://semantic-analysis-java-proxy:8888
      NO_PROXY: localhost,127.0.0.1
    networks:
      - semantic_analysis_java_net
    depends_on:
      - semantic-analysis-java-proxy
    mem_limit: ${SEMANTIC_ANALYSIS_JAVA_MEM_LIMIT:-1536m}
    cpus: ${SEMANTIC_ANALYSIS_JAVA_CPUS:-1.5}
    restart: unless-stopped

  # Egress allow list for `semantic-analysis-java`'s sandboxed
  # `mvn dependency:resolve` step: Maven Central only (repo1.maven.org and
  # repo.maven.apache.org — the default central mirror moved between these
  # around Maven 3.8, both still see real traffic). A separate proxy from
  # the other three on purpose, same reasoning as above.
  semantic-analysis-java-proxy:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-java-proxy:${IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - default
      - semantic_analysis_java_net
    restart: unless-stopped

  # Kotlin sibling of the above four — drives the MIT-licensed
  # fwcd/kotlin-language-server over the same Maven-only trust boundary as
  # Java (gated on `pom.xml`, Gradle out of scope). The language server
  # resolves its own Maven classpath internally (`mvn dependency:list`/
  # `dependency:sources`, both standalone goals), so this driver needs no
  # separate dependency-resolution step of its own — just `mvn` on PATH and
  # a proxied `~/.m2/settings.xml`, same as Java.
  semantic-analysis-kt:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-kt:${IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - semantic_analysis_kt_m2:/home/analyzer/.m2/repository
    environment:
      SEMANTIC_ANALYSIS_KT_TOKEN: ${SEMANTIC_ANALYSIS_KT_TOKEN:-}
      HTTP_PROXY: http://semantic-analysis-kt-proxy:8888
      HTTPS_PROXY: http://semantic-analysis-kt-proxy:8888
      NO_PROXY: localhost,127.0.0.1
    networks:
      - semantic_analysis_kt_net
    depends_on:
      - semantic-analysis-kt-proxy
    mem_limit: ${SEMANTIC_ANALYSIS_KT_MEM_LIMIT:-1536m}
    cpus: ${SEMANTIC_ANALYSIS_KT_CPUS:-1.5}
    restart: unless-stopped

  # Egress allow list for `semantic-analysis-kt`'s sandboxed Maven
  # resolution: Maven Central only, same two hostnames as Java's proxy.
  semantic-analysis-kt-proxy:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-kt-proxy:${IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - default
      - semantic_analysis_kt_net
    restart: unless-stopped

  # PHP sibling of the above five — drives Psalm's built-in
  # psalm-language-server (MIT, vimeo/psalm) over `composer install
  # --no-scripts --no-plugins --no-interaction`. Composer, unlike Maven,
  # actually honors http_proxy/https_proxy env vars (lowercase, CLI-only),
  # so this driver needs no proxied settings-file equivalent to Java/Kotlin's
  # ~/.m2/settings.xml — just the env vars below, translated to lowercase for
  # the composer subprocess. psalm-language-server does not implement
  # textDocument/documentSymbol, so this language's definitions are always
  # empty — diagnostics only.
  semantic-analysis-php:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-php:${IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - semantic_analysis_php_composer:/home/analyzer/.cache/composer
    environment:
      SEMANTIC_ANALYSIS_PHP_TOKEN: ${SEMANTIC_ANALYSIS_PHP_TOKEN:-}
      HTTP_PROXY: http://semantic-analysis-php-proxy:8888
      HTTPS_PROXY: http://semantic-analysis-php-proxy:8888
      NO_PROXY: localhost,127.0.0.1
    networks:
      - semantic_analysis_php_net
    depends_on:
      - semantic-analysis-php-proxy
    mem_limit: ${SEMANTIC_ANALYSIS_PHP_MEM_LIMIT:-1024m}
    cpus: ${SEMANTIC_ANALYSIS_PHP_CPUS:-1.0}
    restart: unless-stopped

  # Egress allow list for `semantic-analysis-php`'s sandboxed Composer
  # install: unlike every other language's single-host registry, Packagist
  # (repo.packagist.org) serves only package metadata — actual dist zip
  # downloads for GitHub-hosted packages (the large majority of the PHP
  # ecosystem) come directly from codeload.github.com/api.github.com/
  # objects.githubusercontent.com. Packages hosted on GitLab/Bitbucket/
  # self-hosted VCS will fail dependency resolution — a known limitation,
  # not a bug (see IDEAS.md item #2).
  semantic-analysis-php-proxy:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-php-proxy:${IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - default
      - semantic_analysis_php_net
    restart: unless-stopped

  # C# via OmniSharp-Roslyn (MIT). Unlike PHP, OmniSharp implements
  # textDocument/documentSymbol, so this language gets both definitions and
  # diagnostics. NuGet (unlike Packagist) serves both package metadata and
  # package content from the same host, so this is back to a single-host
  # egress allow list.
  semantic-analysis-csharp:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-csharp:${IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - semantic_analysis_csharp_nuget:/home/analyzer/.nuget/packages
    environment:
      SEMANTIC_ANALYSIS_CSHARP_TOKEN: ${SEMANTIC_ANALYSIS_CSHARP_TOKEN:-}
      HTTP_PROXY: http://semantic-analysis-csharp-proxy:8888
      HTTPS_PROXY: http://semantic-analysis-csharp-proxy:8888
      NO_PROXY: localhost,127.0.0.1
    networks:
      - semantic_analysis_csharp_net
    depends_on:
      - semantic-analysis-csharp-proxy
    mem_limit: ${SEMANTIC_ANALYSIS_CSHARP_MEM_LIMIT:-1536m}
    cpus: ${SEMANTIC_ANALYSIS_CSHARP_CPUS:-1.5}
    restart: unless-stopped

  # Egress allow list for `semantic-analysis-csharp`'s sandboxed
  # `dotnet restore`/OmniSharp NuGet resolution: api.nuget.org serves both
  # package metadata and package content, so a single host covers it.
  semantic-analysis-csharp-proxy:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-csharp-proxy:${IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - default
      - semantic_analysis_csharp_net
    restart: unless-stopped

  # Ruby via Shopify's ruby-lsp + RuboCop (both MIT). No mature Ruby LSP does
  # real compiler-grade type-checking against untyped Ruby, so diagnostics
  # here are RuboCop's lint/style findings, not type errors — disclosed the
  # same way as PHP's diagnostics-only caveat. ruby-lsp isn't pre-installed
  # in the image: this driver writes its own composed Gemfile per analysis
  # run and `bundle install`s it fresh into the workspace every time, so a
  # RubyGems fetch happens on every run. Like NuGet/Maven Central/PyPI, a
  # single-host egress allow list (rubygems.org) covers it.
  semantic-analysis-ruby:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-ruby:${IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - semantic_analysis_ruby_bundle:/home/analyzer/.cache/bundle
    environment:
      SEMANTIC_ANALYSIS_RUBY_TOKEN: ${SEMANTIC_ANALYSIS_RUBY_TOKEN:-}
      HTTP_PROXY: http://semantic-analysis-ruby-proxy:8888
      HTTPS_PROXY: http://semantic-analysis-ruby-proxy:8888
      NO_PROXY: localhost,127.0.0.1
    networks:
      - semantic_analysis_ruby_net
    depends_on:
      - semantic-analysis-ruby-proxy
    mem_limit: ${SEMANTIC_ANALYSIS_RUBY_MEM_LIMIT:-1536m}
    cpus: ${SEMANTIC_ANALYSIS_RUBY_CPUS:-1.5}
    restart: unless-stopped

  # Egress allow list for `semantic-analysis-ruby`'s `bundle install`:
  # rubygems.org serves both package metadata and package (.gem) content, so
  # a single host covers it.
  semantic-analysis-ruby-proxy:
    image: ghcr.io/codeveira/codeveira-semantic-analysis-ruby-proxy:${IMAGE_TAG:-latest}
    pull_policy: always
    networks:
      - default
      - semantic_analysis_ruby_net
    restart: unless-stopped

  sidekiq:
    image: ghcr.io/codeveira/codeveira:${IMAGE_TAG:-latest}
    pull_policy: always
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://codereview:${DB_PASSWORD:?DB_PASSWORD must be set}@db/codereview
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}
      APP_HOST: ${APP_HOST}
      GITLAB_URL: ${GITLAB_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
      RAILS_INBOUND_EMAIL_PASSWORD: ${RAILS_INBOUND_EMAIL_PASSWORD:-}
      SYMBOL_INDEXER_URL: http://indexer:8090
      SYMBOL_INDEXER_TOKEN: ${SYMBOL_INDEXER_TOKEN:-}
      LINT_RUNNER_URL: http://lint-runner:8091
      LINT_RUNNER_TOKEN: ${LINT_RUNNER_TOKEN:-}
      SEMANTIC_ANALYSIS_URL: http://semantic-analysis:8092
      SEMANTIC_ANALYSIS_TOKEN: ${SEMANTIC_ANALYSIS_TOKEN:-}
      SEMANTIC_ANALYSIS_TS_URL: http://semantic-analysis-ts:8093
      SEMANTIC_ANALYSIS_TS_TOKEN: ${SEMANTIC_ANALYSIS_TS_TOKEN:-}
      SEMANTIC_ANALYSIS_PY_URL: http://semantic-analysis-py:8094
      SEMANTIC_ANALYSIS_PY_TOKEN: ${SEMANTIC_ANALYSIS_PY_TOKEN:-}
      SEMANTIC_ANALYSIS_JAVA_URL: http://semantic-analysis-java:8095
      SEMANTIC_ANALYSIS_JAVA_TOKEN: ${SEMANTIC_ANALYSIS_JAVA_TOKEN:-}
      SEMANTIC_ANALYSIS_KT_URL: http://semantic-analysis-kt:8096
      SEMANTIC_ANALYSIS_KT_TOKEN: ${SEMANTIC_ANALYSIS_KT_TOKEN:-}
      SEMANTIC_ANALYSIS_PHP_URL: http://semantic-analysis-php:8097
      SEMANTIC_ANALYSIS_PHP_TOKEN: ${SEMANTIC_ANALYSIS_PHP_TOKEN:-}
      SEMANTIC_ANALYSIS_CSHARP_URL: http://semantic-analysis-csharp:8098
      SEMANTIC_ANALYSIS_CSHARP_TOKEN: ${SEMANTIC_ANALYSIS_CSHARP_TOKEN:-}
      SEMANTIC_ANALYSIS_RUBY_URL: http://semantic-analysis-ruby:8099
      SEMANTIC_ANALYSIS_RUBY_TOKEN: ${SEMANTIC_ANALYSIS_RUBY_TOKEN:-}
    networks:
      - default
      - semantic_analysis_net
      - semantic_analysis_ts_net
      - semantic_analysis_py_net
      - semantic_analysis_java_net
      - semantic_analysis_kt_net
      - semantic_analysis_php_net
      - semantic_analysis_csharp_net
      - semantic_analysis_ruby_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      indexer:
        condition: service_started
      lint-runner:
        condition: service_started
      semantic-analysis:
        condition: service_started
      semantic-analysis-ts:
        condition: service_started
      semantic-analysis-py:
        condition: service_started
      semantic-analysis-java:
        condition: service_started
      semantic-analysis-kt:
        condition: service_started
      semantic-analysis-php:
        condition: service_started
      semantic-analysis-csharp:
        condition: service_started
      semantic-analysis-ruby:
        condition: service_started
    volumes:
      - ./backup:/backups
      - nginx_certs:/etc/letsencrypt
      - nginx_conf:/etc/nginx/conf.d
      - acme_webroot:/var/www/acme-challenge
    restart: unless-stopped

  # No `ports:` here either — nginx's stream {} block already proxies host
  # port 7777 to this container. See the `app` service note above.
  lsp:
    image: ghcr.io/codeveira/codeveira-lsp:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      CODEVEIRA_URL: http://app:3000
      LSP_PORT: 7777
      LSP_PROXY_SHARED_SECRET: ${LSP_PROXY_SHARED_SECRET:-}
    depends_on:
      - app
    restart: unless-stopped

  # Reverse proxy + TLS termination. Boots with a zero-config self-signed
  # certificate; configure a real domain and either upload your own
  # certificate or issue one automatically via Let's Encrypt (HTTP-01 or
  # DNS-01) from Settings → Domain & HTTPS once the app is running. See the
  # "Domain & HTTPS" section below.
  nginx:
    image: ghcr.io/codeveira/codeveira-nginx:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "80:80"
      - "443:443"
      - "${LSP_PORT:-7777}:7777"
    volumes:
      - nginx_certs:/etc/letsencrypt
      - nginx_conf:/etc/nginx/conf.d
      - acme_webroot:/var/www/acme-challenge
    depends_on:
      - app
      - lsp
    restart: unless-stopped

networks:
  default: {}
  # No route out except semantic-analysis-proxy's allow list (see that
  # service's comment above) — `internal: true` means Docker gives this
  # network no gateway to the outside world at all.
  semantic_analysis_net:
    internal: true
  # Same isolation as semantic_analysis_net, scoped to semantic-analysis-ts
  # and its own proxy instead — kept separate so neither sandboxed
  # language's egress can reach the other's package registry.
  semantic_analysis_ts_net:
    internal: true
  # Same isolation again, scoped to semantic-analysis-py and its own proxy.
  semantic_analysis_py_net:
    internal: true
  # Same isolation again, scoped to semantic-analysis-java and its own proxy.
  semantic_analysis_java_net:
    internal: true
  # Same isolation again, scoped to semantic-analysis-kt and its own proxy.
  semantic_analysis_kt_net:
    internal: true
  # Same isolation again, scoped to semantic-analysis-php and its own proxy.
  semantic_analysis_php_net:
    internal: true
  # Same isolation again, scoped to semantic-analysis-csharp and its own proxy.
  semantic_analysis_csharp_net:
    internal: true
  # Same isolation again, scoped to semantic-analysis-ruby and its own proxy.
  semantic_analysis_ruby_net:
    internal: true

volumes:
  app_storage:
  nginx_certs:
  nginx_conf:
  acme_webroot:
  # Per-language dependency-install caches for the semantic-analysis-*
  # services — each package manager already caches by package name+version
  # internally, so a persistent named volume at the existing (or newly
  # added) cache-dir env var is enough to avoid re-downloading unchanged
  # dependencies on every /analyze request; no custom hashing/eviction code
  # needed. Shared across every repo this instance analyzes for that
  # language (safe: only ever holds public package content that already
  # passed through that language's egress-allowlist proxy, never target-repo
  # source). No automatic eviction/size cap — grows unboundedly like any CI
  # package cache; clear one manually with `docker volume rm` if disk usage
  # becomes a concern.
  semantic_analysis_go_mod:
  semantic_analysis_ts_npm:
  semantic_analysis_py_pip:
  semantic_analysis_java_m2:
  semantic_analysis_kt_m2:
  semantic_analysis_php_composer:
  semantic_analysis_csharp_nuget:
  semantic_analysis_ruby_bundle:
