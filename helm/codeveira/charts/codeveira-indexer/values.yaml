# Optional -- disabled by default. Without it, symbol indexing (Find Usages/
# Go to Declaration/Go to Symbol, and the code intelligence behind them)
# stays inactive; nothing else in the app depends on it being up.
enabled: false

image:
  repository: ghcr.io/codeveira/codeveira-indexer
  tag: latest
  pullPolicy: Always

replicaCount: 1

# Named "indexer" by default (matching the docker-compose service name),
# same reasoning as codeveira-redis's fixed name -- so codeveira-app/
# codeveira-sidekiq's default SYMBOL_INDEXER_URL can find it with no
# umbrella-level string coordination.
service:
  name: indexer
  port: 8090

maxFileSizeBytes: "2000000"

# Shared secret required in the X-Indexer-Token header. Optional but
# strongly recommended -- blank means /index accepts requests from anything
# reachable on the cluster network with no authentication (the indexer logs
# a startup warning in that case). Must match codeveira-app's and
# codeveira-sidekiq's integrations.symbolIndexerToken (or set once via
# global.integrations.symbolIndexerToken in the umbrella chart instead).
auth:
  token: ""

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    memory: 768Mi

nodeSelector: {}
tolerations: []
affinity: {}
