{{- if .Values.enabled }}
{{- $g := .Values.global -}}
{{- $token := ($g.integrations).symbolIndexerToken | default .Values.auth.token -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codeveira-common.fullname" . }}
  labels:
    {{- include "codeveira-common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "codeveira-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "codeveira-common.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: indexer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: INDEXER_PORT
              value: "8090"
            - name: MAX_FILE_SIZE_BYTES
              value: {{ .Values.maxFileSizeBytes | quote }}
            - name: INDEXER_TOKEN
              value: {{ $token | quote }}
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
