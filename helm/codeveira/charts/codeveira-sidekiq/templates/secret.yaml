{{- if .Values.enabled }}
{{- $g := .Values.global | default dict -}}
{{- $dbHost := ($g.database).host | default .Values.database.host -}}
{{- $dbPort := ($g.database).port | default .Values.database.port -}}
{{- $dbName := ($g.database).name | default .Values.database.name -}}
{{- $dbUser := ($g.database).user | default .Values.database.user -}}
{{- $dbPassword := ($g.database).password | default .Values.database.password -}}
{{- $redisHost := ($g.redis).host | default .Values.redis.host -}}
{{- $redisPort := ($g.redis).port | default .Values.redis.port -}}
{{- $sentinelEnabled := .Values.redisSentinel.enabled -}}
{{- if hasKey ($g.redis) "sentinelEnabled" }}{{ $sentinelEnabled = ($g.redis).sentinelEnabled }}{{ end -}}
{{- $sentinelMasterName := ($g.redis).sentinelMasterName | default .Values.redisSentinel.masterName -}}
{{- $sentinelHosts := ($g.redis).sentinelHosts | default .Values.redisSentinel.hosts -}}
{{- $secretKeyBase := ($g.rails).secretKeyBase | default .Values.rails.secretKeyBase -}}
{{- $encPrimary := ($g.rails).encryptionPrimaryKey | default .Values.rails.encryptionPrimaryKey -}}
{{- $encDeterministic := ($g.rails).encryptionDeterministicKey | default .Values.rails.encryptionDeterministicKey -}}
{{- $encSalt := ($g.rails).encryptionKeyDerivationSalt | default .Values.rails.encryptionKeyDerivationSalt -}}
{{- $appHost := $g.appHost | default .Values.appHost -}}
{{- $i := .Values.integrations -}}
{{- if not $dbPassword }}
{{- fail "codeveira-sidekiq: database.password (or global.database.password) is required" }}
{{- end }}
{{- if not $secretKeyBase }}
{{- fail "codeveira-sidekiq: rails.secretKeyBase (or global.rails.secretKeyBase) is required" }}
{{- end }}
{{- if or (not $encPrimary) (not $encDeterministic) (not $encSalt) }}
{{- fail "codeveira-sidekiq: rails.encryption* keys (or global.rails.*) are required" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codeveira-common.fullname" . }}
  labels:
    {{- include "codeveira-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  RAILS_ENV: production
  DATABASE_URL: "postgresql://{{ $dbUser }}:{{ $dbPassword }}@{{ $dbHost }}:{{ $dbPort }}/{{ $dbName }}"
  REDIS_URL: "redis://{{ $redisHost }}:{{ $redisPort }}/0"
  {{- if $sentinelEnabled }}
  REDIS_SENTINELS: {{ $sentinelHosts | join "," | quote }}
  REDIS_MASTER_NAME: {{ $sentinelMasterName | quote }}
  {{- end }}
  SECRET_KEY_BASE: {{ $secretKeyBase | quote }}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: {{ $encPrimary | quote }}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: {{ $encDeterministic | quote }}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: {{ $encSalt | quote }}
  APP_HOST: {{ $appHost | quote }}
  GITLAB_URL: {{ $i.gitlabUrl | quote }}
  SYMBOL_INDEXER_URL: {{ $i.symbolIndexerUrl | quote }}
  SYMBOL_INDEXER_TOKEN: {{ ($g.integrations).symbolIndexerToken | default $i.symbolIndexerToken | quote }}
  LINT_RUNNER_URL: {{ $i.lintRunnerUrl | quote }}
  LINT_RUNNER_TOKEN: {{ ($g.integrations).lintRunnerToken | default $i.lintRunnerToken | quote }}
  {{- range $sa := $i.semanticAnalysis }}
  {{ $sa.envPrefix }}_URL: {{ $sa.url | quote }}
  {{ $sa.envPrefix }}_TOKEN: {{ dig "integrations" "semanticAnalysisTokens" $sa.name $sa.token $g | quote }}
  {{- end }}
  INBOUND_EMAIL_DOMAIN: {{ $i.inboundEmailDomain | quote }}
  RAILS_INBOUND_EMAIL_PASSWORD: {{ $i.railsInboundEmailPassword | quote }}
  SMTP_HOST: {{ $i.smtpHost | quote }}
  SMTP_PORT: {{ $i.smtpPort | quote }}
  SMTP_USER: {{ $i.smtpUser | quote }}
  SMTP_PASSWORD: {{ $i.smtpPassword | quote }}
  SMTP_FROM: {{ $i.smtpFrom | quote }}
{{- end }}
