{{- if $.Values.enabled }}
{{- if .Values.clusterIssuer.create }}
{{- if not .Values.clusterIssuer.email }}
{{- fail "codeveira-ingress: clusterIssuer.email is required when clusterIssuer.create is true (Let's Encrypt needs a contact address)" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
  labels:
    {{- include "codeveira-common.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.clusterIssuer.server }}
    email: {{ .Values.clusterIssuer.email }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.className }}
{{- end }}
{{- end }}
