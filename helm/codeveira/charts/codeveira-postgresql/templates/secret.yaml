{{- if .Values.enabled }}
{{- $password := (.Values.global.database).password | default .Values.database.password -}}
{{- if not $password }}
{{- fail "codeveira-postgresql: database.password (or global.database.password) is required" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codeveira-common.fullname" . }}
  labels:
    {{- include "codeveira-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
