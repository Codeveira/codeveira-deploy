{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default (include "codeveira-common.fullname" .) }}
  labels:
    {{- include "codeveira-common.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "codeveira-common.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
{{- end }}
