{{- if and .Values.enabled .Values.persistence.enabled }}
{{- $root := . -}}
{{- range $name, $lang := .Values.languages }}
{{- if $lang.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "codeveira-common.fullname" $root }}-{{ $name }}-cache
  labels:
    {{- include "codeveira-common.labels" $root | nindent 4 }}
    app.kubernetes.io/component: semantic-analysis-{{ $name }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if $root.Values.persistence.storageClassName }}
  storageClassName: {{ $root.Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ $root.Values.persistence.size }}
{{- end }}
{{- end }}
{{- end }}
